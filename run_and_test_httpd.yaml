---
- name: Install, start, and test httpd
  hosts: centos9-01
  become: true
  gather_facts: false

  tasks:
    - name: Install httpd
      package:
        name: httpd
        state: present

    - name: Start and enable httpd
      service:
        name: httpd
        state: started
        enabled: true

    - name: Allow HTTP through firewalld
      firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

    - name: Create test web page
      copy:
        content: "Apache installed successfully by Ansible Tower\n"
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"

    - name: Test HTTP from Tower
      uri:
        url: http://centos9-01
        status_code: 200
        return_content: true
      delegate_to: localhost
      become: false
